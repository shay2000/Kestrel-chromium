name: macOS visual smoke test

on:
  workflow_dispatch:
    inputs:
      stress_cycles:
        description: "Visible-user stress cycles (0 disables, 1–30 enables)"
        default: "0"
        type: string
      probe_only:
        description: "Diagnose cached app accessibility only; not a stress/acceptance run"
        default: false
        type: boolean
  pull_request:

jobs:
  build-and-capture:
    name: ${{ inputs.probe_only == true && 'Accessibility diagnostic (not acceptance)' || 'Native tests, builds and visible UI' }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort | tail -1)"
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Restore verified-source build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ${{ runner.temp }}/derived-data
          key: kestrel-macos-26-${{ hashFiles('KestrelWebKit/**', 'KestrelWebKit.xcodeproj/**', 'Tests/**', 'Package.*', 'build.sh', 'scripts/*.swift', '!scripts/macos-accessibility.swift', 'scripts/package-codex-runtime.sh') }}

      - name: Run deterministic test suite on macOS
        if: inputs.probe_only != true
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/kestrel-tests.log"

      - name: Build packaged app
        if: inputs.probe_only != true
        run: |
          xcodebuild \
            -project KestrelWebKit.xcodeproj \
            -scheme Kestrel \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG build
      - name: Verify standalone packaging and app signatures
        if: inputs.probe_only != true
        shell: bash
        env:
          KESTREL_BUILD_DIR: ${{ runner.temp }}/kestrel-standalone
        run: |
          set -o pipefail
          bash -n build.sh
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/kestrel-package.log"
          codesign --verify --deep --strict "$RUNNER_TEMP/derived-data/Build/Products/Debug/Kestrel.app"
      - name: Cache verified-source builds for UI harness iterations
        if: inputs.probe_only != true && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ${{ runner.temp }}/derived-data
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Diagnose cached app accessibility
        if: inputs.probe_only == true
        shell: bash
        env:
          KESTREL_UI_PROBE: "journey"
          KESTREL_STRESS_APP: ${{ runner.temp }}/derived-data/Build/Products/Debug/Kestrel.app
          KESTREL_STRESS_OUT: ${{ runner.temp }}/kestrel-screenshots/accessibility-probe
          KESTREL_STRESS_CYCLES: "1"
        run: |
          test '${{ steps.build-cache.outputs.cache-hit }}' = true
          codesign --verify --deep --strict "$KESTREL_STRESS_APP"
          mkdir -p "$KESTREL_STRESS_OUT"
          python3 scripts/macos-user-stress.py 2>&1 | tee "$KESTREL_STRESS_OUT/run.log"
      - name: Stress visible browser and Assistant interactions
        if: github.event_name == 'workflow_dispatch' && inputs.probe_only != true && inputs.stress_cycles != '0'
        shell: bash
        env:
          KESTREL_STRESS_CYCLES: ${{ inputs.stress_cycles }}
        run: |
          set -o pipefail
          # A packaged app must resolve resources without its build checkout.
          mv .build "$RUNNER_TEMP/kestrel-swiftpm-build-hidden"
          for kind in xcode standalone; do
            if [[ "$kind" == xcode ]]; then
              export KESTREL_STRESS_APP="$RUNNER_TEMP/derived-data/Build/Products/Debug/Kestrel.app"
            else
              export KESTREL_STRESS_APP="$RUNNER_TEMP/kestrel-standalone/Kestrel.app"
            fi
            export KESTREL_STRESS_OUT="$RUNNER_TEMP/kestrel-screenshots/user-stress/$kind"
            mkdir -p "$KESTREL_STRESS_OUT"
            python3 scripts/macos-user-stress.py 2>&1 | tee "$KESTREL_STRESS_OUT/run.log"
          done
      - name: Launch app and capture dark/light screenshots
        if: inputs.probe_only != true
        run: |
          APP="$RUNNER_TEMP/derived-data/Build/Products/Debug/Kestrel.app"
          OUT="$RUNNER_TEMP/kestrel-screenshots"
          mkdir -p "$OUT"
          # This disposable runner has accessibility Reduce Transparency and
          # desktop tinting enabled by default. Disable both for this visual
          # test only; never change a user's machine preferences.
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write -g AppleReduceDesktopTinting -bool false
          killall cfprefsd 2>/dev/null || true
          sleep 2
          # Set a high-contrast test wallpaper so material sampling is visible.
          python3 - <<'PY'
          import os, pathlib, struct, zlib
          width, height = 1800, 1200
          palette = [(255, 30, 30), (20, 240, 70), (28, 105, 255), (255, 220, 20)]
          rows = []
          for y in range(height):
            row = bytearray([0])
            for x in range(width):
              # Four full-height, screen-scale colour fields expose any real
              # blur/transparency far better than a checkerboard does.
              colour = palette[min(3, (x * 4) // width)]
              row.extend(colour)
            rows.append(bytes(row))
          def chunk(kind, data):
            return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>2I5B', width, height, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(b''.join(rows), 6)) + chunk(b'IEND', b'')
          wallpaper = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kestrel-vivid-wallpaper.png'
          wallpaper.write_bytes(png)
          print(wallpaper)
          PY
          cat > "$RUNNER_TEMP/set-wallpaper.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let wallpaper = URL(fileURLWithPath: CommandLine.arguments[1]).standardizedFileURL
          let workspace = NSWorkspace.shared
          let screens = NSScreen.screens
          let reduceTransparency = workspace.accessibilityDisplayShouldReduceTransparency
          let reduceDesktopTinting = UserDefaults.standard.bool(forKey: "AppleReduceDesktopTinting")
          print("Reduce transparency enabled: \(reduceTransparency)")
          print("Reduce desktop tinting enabled: \(reduceDesktopTinting)")
          guard !reduceTransparency else { fatalError("Runner still forces Reduce Transparency; wallpaper material cannot be visually verified") }
          guard !reduceDesktopTinting else { fatalError("Runner still reduces desktop tinting; wallpaper material cannot be visually verified") }
          guard !screens.isEmpty else { fatalError("No runner screens found") }
          for screen in screens {
            try workspace.setDesktopImageURL(wallpaper, for: screen, options: [:])
          }
          Thread.sleep(forTimeInterval: 2)
          for screen in screens {
            let applied = workspace.desktopImageURL(for: screen)?.standardizedFileURL
            print("Wallpaper on \(screen.localizedName): \(applied?.path ?? "<missing>")")
            guard applied == wallpaper else { fatalError("Wallpaper read-back did not match: \(applied?.path ?? "<missing>")") }
          }
          SWIFT
          swift "$RUNNER_TEMP/set-wallpaper.swift" "$RUNNER_TEMP/kestrel-vivid-wallpaper.png" | tee "$OUT/test-wallpaper-readback.txt"
          screencapture -x "$OUT/test-wallpaper-desktop.png"
          capture() {
            osascript -e 'tell application "Kestrel" to activate' >/dev/null 2>&1 || true
            sleep 1
            pgrep -x Kestrel >/dev/null
            test "$(osascript -e 'tell application "System Events" to tell process "Kestrel" to count windows')" -gt 0
            screencapture -x "$OUT/$1.png"
            osascript -e 'tell application "System Events" to tell process "Kestrel" to get {position, size} of window 1' > "$OUT/$1-window.txt"
          }
          python3 - <<'PY'
          import base64, json, plistlib, subprocess, uuid
          sites = [
            ('Google', 'https://www.google.com'), ('GitHub', 'https://github.com'),
            ('Exa', 'https://exa.ai'), ('Apple', 'https://www.apple.com'),
            ('BBC', 'https://www.bbc.co.uk'), ('Wikipedia', 'https://www.wikipedia.org'),
          ]
          records = []
          bookmarks = []
          for title, url in sites:
            ident = str(uuid.uuid4()).upper()
            page = {'id': ident, 'title': title, 'urlString': url, 'faviconURL': None}
            records.append({'page': page, 'customTitle': None})
            bookmarks.append(page)
          pinned_payload = json.dumps(records, separators=(',', ':')).encode()
          bookmark_payload = json.dumps(bookmarks, separators=(',', ':')).encode()
          plist = {
            'kestrel.debug.layout': True,
            'kestrel.appearance.mode.v1': 'dark',
            'kestrel.appearance.translucent-chrome.v1': True,
            'Kestrel.tabs.pinned.v1': pinned_payload,
            'kestrel.browser.bookmarks.v1': bookmark_payload,
          }
          with open('/tmp/kestrel-defaults.plist', 'wb') as f: plistlib.dump(plist, f)
          subprocess.run(['defaults', 'import', 'com.shayprasad.Kestrel', '/tmp/kestrel-defaults.plist'], check=True)
          PY
          open -a "$APP" --stderr "$OUT/native-layout.log"
          sleep 12
          pgrep -x Kestrel >/dev/null
          osascript -e 'tell application "Kestrel" to activate' || true
          sleep 3
          capture kestrel-dark
          osascript -e 'tell application "System Events" to keystroke "e" using {command down}' || true
          sleep 3
          capture kestrel-dark-assistant
          osascript -e 'tell application "Kestrel" to quit'
          sleep 3
          open -a "$APP" --stderr "$OUT/native-layout.log"
          sleep 12
          open -a "$APP" "https://www.github.com"
          sleep 10
          osascript -e 'tell application "Kestrel" to activate'
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "e" using {command down}'
          sleep 3
          capture kestrel-dark-assistant-webpage
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "e" using {command down}'
          sleep 3
          capture kestrel-dark-webpage-no-assistant
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "s" using {command down, control down}'
          sleep 3
          capture kestrel-dark-sidebar-closed
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "s" using {command down, control down}'
          sleep 2
          osascript -e 'tell application "Kestrel" to quit' || true
          sleep 3
          defaults write com.shayprasad.Kestrel 'kestrel.appearance.mode.v1' -string light
          open -a "$APP" --stderr "$OUT/native-layout.log"
          sleep 12
          pgrep -x Kestrel >/dev/null
          osascript -e 'tell application "Kestrel" to activate' || true
          sleep 3
          capture kestrel-light
          open -a "$APP" "https://www.github.com"
          sleep 10
          osascript -e 'tell application "Kestrel" to activate' || true
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "e" using {command down}' || true
          sleep 3
          capture kestrel-light-assistant-webpage
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "e" using {command down}' || true
          sleep 3
          capture kestrel-light-webpage-no-assistant
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "s" using {command down, control down}' || true
          sleep 3
          capture kestrel-light-sidebar-closed
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "e" using {command down}'
          sleep 3
          capture kestrel-light-assistant-only
          osascript -e 'tell application "System Events" to tell process "Kestrel" to set size of window 1 to {980, 650}'
          sleep 3
          capture kestrel-light-resized
          # Show the new default-on preference in its real Settings window.
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "," using {command down}' || true
          sleep 4
          capture kestrel-settings-light
          # Browser shortcuts must yield to the Settings window's native Close.
          osascript -e 'tell application "System Events" to tell process "Kestrel" to keystroke "w" using {command down}'
          sleep 1
          test "$(osascript -e 'tell application "System Events" to tell process "Kestrel" to get name of window 1')" != "Kestrel Settings"
          # Exercise the real Tabs menu to create a split from a loaded page.
          osascript -e 'tell application "Kestrel" to quit' || true
          sleep 3
          defaults write com.shayprasad.Kestrel 'kestrel.appearance.mode.v1' -string dark
          open -a "$APP" "https://www.github.com"
          sleep 18
          osascript -e 'tell application "Kestrel" to activate'
          osascript -e 'tell application "System Events" to tell process "Kestrel" to click menu bar item "Tabs" of menu bar 1'
          sleep 1
          osascript -e 'tell application "System Events" to tell process "Kestrel" to get name of every menu item of menu 1 of menu bar item "Tabs" of menu bar 1' > "$OUT/tabs-menu.txt"
          osascript -e 'tell application "System Events" to tell process "Kestrel" to click menu item "Move Tab to Left Split" of menu 1 of menu bar item "Tabs" of menu bar 1'
          sleep 5
          capture split-created-from-menu
          # Also exercise the split placement keyboard shortcut.
          osascript -e 'tell application "System Events" to tell process "Kestrel" to key code 123 using {command down}' || true
          sleep 3
          capture split-after-keyboard-shortcut
          # The split creates a second tab; select it and load a different site.
          osascript -e 'tell application "System Events" to tell process "Kestrel" to key code 124 using {command down, control down, option down}'
          sleep 2
          open -a "$APP" "https://www.wikipedia.org"
          sleep 18
          capture split-two-distinct-sites
          osascript -e 'tell application "System Events" to tell process "Kestrel" to key code 123 using {command down, control down, option down}'
          sleep 2
          capture split-focus-left
          osascript -e 'tell application "System Events" to tell process "Kestrel" to key code 124 using {command down, control down, option down}'
          sleep 2
          capture split-focus-right
      - name: Upload app and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-visual-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/derived-data/Build/Products/Debug/Kestrel.app
            ${{ runner.temp }}/kestrel-standalone/Kestrel.app
            ${{ runner.temp }}/kestrel-screenshots
            ${{ runner.temp }}/kestrel-tests.log
            ${{ runner.temp }}/kestrel-package.log
          if-no-files-found: warn
