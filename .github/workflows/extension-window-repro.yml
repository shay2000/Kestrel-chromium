name: Reproduce extension window ownership

on:
  push:
    branches: [fix/extension-windows]
    paths: [.github/workflows/extension-window-repro.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kestrel-Chromium-macOS-DMG
          run-id: 41208164060
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Mount and copy the published app
        shell: bash
        run: |
          cd "$RUNNER_TEMP/original"
          shasum -a 256 -c Kestrel-Chromium-1.0.0-arm64.dmg.sha256
          hdiutil attach -readonly -nobrowse Kestrel-Chromium-1.0.0-arm64.dmg -mountpoint "$RUNNER_TEMP/original-mount"
          ditto "$RUNNER_TEMP/original-mount/Kestrel.app" "$RUNNER_TEMP/Kestrel.app"
          hdiutil detach "$RUNNER_TEMP/original-mount"
      - name: Install real extensions and inspect every native window
        shell: bash
        run: |
          swiftc -swift-version 5 -parse-as-library scripts/test-chrome-web-store-macos.swift -o "$RUNNER_TEMP/extension-window-test"
          "$RUNNER_TEMP/extension-window-test" "$RUNNER_TEMP/Kestrel.app" "$RUNNER_TEMP/extension-window-evidence" 2>&1 | tee "$RUNNER_TEMP/extension-window.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-window-reproduction
          path: |
            ${{ runner.temp }}/extension-window-evidence
            ${{ runner.temp }}/extension-window.log
          if-no-files-found: warn
